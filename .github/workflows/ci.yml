name: CI

on:
  push:
    branches: [main, master, develop, 'refactor/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3002
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: database_test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DIALECT: mysql
      JWT_KEY: testSecretKey
      JWT_EXPIRY: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment files
        run: |
          cp apps/flight/.env.example apps/flight/.env
          cp apps/auth/.env.example apps/auth/.env

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
